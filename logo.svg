<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Patchwork Logo</title>
  <desc id="desc">A quilt-inspired patchwork icon.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f4ea" />
      <stop offset="1" stop-color="#efe6d4" />
    </linearGradient>
    <clipPath id="quiltClip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="192" height="192" rx="24" />
    </clipPath>
    <style>
      .tile { stroke: #f6f0e5; stroke-width: 4; }
      .stitch {
        stroke: #2f4358;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 5 6;
        fill: none;
        opacity: 0.85;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="240" height="240" fill="url(#bg)" rx="18" />

  <g transform="translate(24 24)">
    <rect x="0" y="0" width="192" height="192" rx="24" fill="#f4ecdc" />

    <g clip-path="url(#quiltClip)">
      <rect class="tile" x="0" y="0" width="64" height="64" fill="#d56e56" />
      <rect class="tile" x="64" y="0" width="64" height="64" fill="#f0b86a" />
      <rect class="tile" x="128" y="0" width="64" height="64" fill="#8fb7a4" />

      <rect class="tile" x="0" y="64" width="64" height="64" fill="#6e8ab5" />
      <rect class="tile" x="64" y="64" width="64" height="64" fill="#efdfb3" />
      <rect class="tile" x="128" y="64" width="64" height="64" fill="#d8858f" />

      <rect class="tile" x="0" y="128" width="64" height="64" fill="#9eb97b" />
      <rect class="tile" x="64" y="128" width="64" height="64" fill="#b77f59" />
      <rect class="tile" x="128" y="128" width="64" height="64" fill="#5f9bb2" />

      <path class="stitch" d="M0 64H192M0 128H192M64 0V192M128 0V192" />
      <path class="stitch" d="M16 16L176 176M176 16L16 176" />
    </g>

    <rect x="0" y="0" width="192" height="192" rx="24" fill="none" stroke="#324b66" stroke-width="5" />
  </g>

</svg>
