name: Deploy Example Board to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-example-board.yml'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'examples/boards/celebration/**'
      - 'examples/boards/celebration'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build celebration board
        run: go run . examples/boards/celebration public

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
